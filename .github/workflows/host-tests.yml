name: Host core tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate asset generators
        run: |
          python3 -m py_compile scripts/build-mvs-visual-assets.py scripts/build_premium_opening_v5.py
          python3 scripts/build_premium_opening_v5.py --help >/dev/null
      - name: Build and fuzz core
        run: make test
