name: Host core tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate asset generator
        run: python3 -m py_compile scripts/build-mvs-visual-assets.py
      - name: Build and fuzz core
        run: make test
